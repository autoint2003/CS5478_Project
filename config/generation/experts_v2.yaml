# Authoritative seven-branch expert generation for dataset_version experts_v2.
# Source ICs are post-Stage-1 stable captures (see per-branch overrides).
# Do not import historical Precision action tapes.
#
# Official Precision Oracle: support-transfer only.
# use_verified_lateral_fallback must remain false on every production branch.
# Legacy verified_lateral lives only under experiments/ for historical comparison.

dataset_version: experts_v2
oracle_implementation: precision_state_machine_v23
success_criteria_version: SUCCESS_12S_and_SUCCESS_NEW_frozen
config_id: experts_v2_official_st_dx1fix_no_vl_fallback

output_root: data/experts_v2_official
source_manifest: results/data_generation/stage2_abc_final_v2/manifest.jsonl
source_ics: results/data_generation/stage2_abc_final_v2/ics

# Branch → plan_provenance filter on the source manifest.
# Stage-1 search is not re-executed for Precision/Direct ICs that already hold capture+ref.
branches:
  A_STABLE_DIRECT_HANDOFF:
    plan_provenance: [A_STAGE1]
    continuation: direct_handoff
    source_manifest: results/data_generation/plan_a_stage1_terminals_v1/manifest.jsonl
    source_ics: results/data_generation/plan_a_stage1_terminals_v1/ics
  A_STABLE_PRECISION:
    plan_provenance: [A]
    continuation: precision
    precision_config:
      use_verified_lateral_fallback: false
  B_STABLE_DIRECT_HANDOFF:
    plan_provenance: [B]
    continuation: direct_handoff
  B_STABLE_PRECISION:
    plan_provenance: [B]
    continuation: precision
    precision_config:
      use_verified_lateral_fallback: false
  C_RECATCH_DIRECT_HANDOFF:
    plan_provenance: [C]
    continuation: direct_handoff
  C_RECATCH_PRECISION:
    plan_provenance: [C]
    continuation: precision
    precision_config:
      use_verified_lateral_fallback: false
  D_PRECISION:
    # No Stage-1 A/B/C prefix — discovery skips Stage-1 registry; live D2
    # eligibility (SUCCESS_12S + Precision-required) is enforced at generate time.
    plan_provenance: [HARD_IC]
    continuation: precision
    precision_config:
      use_verified_lateral_fallback: false

admit_success: SUCCESS_NEW
# Dual metrics always recorded. P10 pilot promotes RELAXED admission under
# config/generation/experts_v2_p10_pilot.yaml; production cutover is explicit.
track_success_12s: true
seed: 0
require_stage1_evidence: true
