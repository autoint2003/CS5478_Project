# P9 bounded pilot config — does not replace production experts_v2.yaml.
# D_PRECISION ICs are independently stable (no Stage-1 prefix); skip Stage-1
# registry gate for that branch only via require_stage1_evidence at call site.

dataset_version: experts_v2_p9_pilot
oracle_implementation: precision_state_machine_v23_fsm_p9
success_criteria_version: SUCCESS_12S_and_SUCCESS_NEW_frozen_plus_dual_theta
config_id: experts_v2_p9_fsm_pilot

output_root: results/diagnostics/p9_expert_fsm_dataset/generation_pilot
source_manifest: results/data_generation/stage2_abc_final_v2/manifest.jsonl
source_ics: results/data_generation/stage2_abc_final_v2/ics

# Inherit branch structure from production naming.
branches:
  A_STABLE_DIRECT_HANDOFF:
    plan_provenance: [A_STAGE1]
    continuation: direct_handoff
    source_manifest: results/data_generation/plan_a_stage1_terminals_v1/manifest.jsonl
    source_ics: results/data_generation/plan_a_stage1_terminals_v1/ics
  A_STABLE_PRECISION:
    plan_provenance: [A]
    continuation: precision
    precision_config:
      use_verified_lateral_fallback: false
      use_explicit_fsm: true
      max_dtheta_attempts: 1
  B_STABLE_DIRECT_HANDOFF:
    plan_provenance: [B]
    continuation: direct_handoff
  B_STABLE_PRECISION:
    plan_provenance: [B]
    continuation: precision
    precision_config:
      use_verified_lateral_fallback: false
      use_explicit_fsm: true
      max_dtheta_attempts: 1
  C_RECATCH_DIRECT_HANDOFF:
    plan_provenance: [C]
    continuation: direct_handoff
  C_RECATCH_PRECISION:
    plan_provenance: [C]
    continuation: precision
    precision_config:
      use_verified_lateral_fallback: false
      use_explicit_fsm: true
      max_dtheta_attempts: 1
  D_PRECISION:
    plan_provenance: [HARD_IC]
    continuation: precision
    precision_config:
      use_verified_lateral_fallback: false
      use_explicit_fsm: true
      max_dtheta_attempts: 1

admit_success: SUCCESS_NEW
track_success_12s: true
seed: 0
require_stage1_evidence: true
