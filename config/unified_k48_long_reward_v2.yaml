# Three epochs of K=48 GRPO with outcome-aware reward v2.
# Same schedule, seed, and hyperparameters as config/unified_k48_long_reward_v1.yaml.
# Does not write into grpo_pilot, grpo_long, or grpo_pilot_reward_v2.

codebook: demo_results/diagnostics/raw/legal_recovery_v2/codebook_selected_k47.npy
supervised_targets: demo_results/diagnostics/raw/k48_handoff/supervised_targets.jsonl
grpo_initial_conditions: demo_results/diagnostics/raw/k48_handoff/grpo_initial_conditions.jsonl
supervised_output: demo_results/diagnostics/raw/unified_k48/supervised
eval_output: demo_results/diagnostics/raw/unified_k48/eval_long_reward_v2
grpo_output: demo_results/diagnostics/raw/unified_k48/grpo_long_reward_v2
baseline_eval: demo_results/diagnostics/raw/horizon_migration/checkpoint_eval.json
seed: 1
device: cuda
eval_device: cpu
epochs: 40
batch_size: 8
lr: 0.0003
grpo_updates: 936
ic_epochs: 3
cover_all_ics: true
grpo_lr: 0.00003
kl_coef: 0.05
clip: 0.2
group: 4
grpo_save_every: 312
rollout_cap_steps: 200
eval_cap_steps: 200
lambda_time: 0.05
nominal_seconds: 12.0
recovery_limit_s: 4.0
reward_version: v2
expand_handoff: true
