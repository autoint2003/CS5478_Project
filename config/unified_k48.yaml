# K=48 training. Tokens 0-46 are the unchanged motion codebook. Token 47 is HANDOFF.
# Running --supervised or --grpo starts training. Do not point this at the historical checkpoint directory.

codebook: results/diagnostics/raw/legal_recovery_v2/codebook_selected_k47.npy
supervised_targets: results/diagnostics/raw/k48_handoff/supervised_targets.jsonl
grpo_initial_conditions: results/diagnostics/raw/k48_handoff/grpo_initial_conditions.jsonl
supervised_output: results/diagnostics/raw/unified_k48/supervised
eval_output: results/diagnostics/raw/unified_k48/eval
grpo_output: results/diagnostics/raw/unified_k48/grpo_pilot
baseline_eval: results/diagnostics/raw/horizon_migration/checkpoint_eval.json
seed: 1
device: cuda
eval_device: cpu
epochs: 40
batch_size: 8
lr: 0.0003
grpo_updates: 20
grpo_lr: 0.00003
kl_coef: 0.05
clip: 0.2
group: 4
grpo_save_every: 5
rollout_cap_steps: 200
eval_cap_steps: 200
lambda_time: 0.05
nominal_seconds: 12.0
recovery_limit_s: 4.0
reward_version: v1
expand_handoff: true
