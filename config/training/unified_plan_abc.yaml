# Active training config for the regenerated six-branch experts_v2 dataset.
# Do not launch SFT/GRPO until the experts_v2 generation and audit are complete.
# Historical Precision tapes under data/unified_experts/ are excluded from training.

schema_version: experts_v2
dataset_version: experts_v2
dataset:
  index: data/experts_v2/index.json
  splits: data/experts_v2/splits.json
  manifest: data/experts_v2/manifest.jsonl
  root: data/experts_v2/
  branches:
    - A_STABLE_PRECISION
    - B_STABLE_DIRECT_HANDOFF
    - B_STABLE_PRECISION
    - C_RECATCH_DIRECT_HANDOFF
    - C_RECATCH_PRECISION
    - D_PRECISION
  # Historical namespace retained for reproducibility only; loaders must reject
  # Precision rows that lack dataset_version=experts_v2.
  legacy_unified_experts: data/unified_experts/
  legacy_supervised: data/supervised_targets_with_horizontal.jsonl

observation:
  dim: 39
  version: obs_gt_airborne_39
  privileged_runtime: false

action:
  interface: legal_7d
  control_period_s: 0.02
  # Continuous expert actions are authoritative. K49 quantization is a separate
  # audit; do not silently replace continuous Oracle tapes with K49 nearest neighbors.
  vocab: continuous_legal_7d
  handoff_token: 47
  remapping_allowed: false

success:
  metric: SUCCESS_NEW
  also_track: SUCCESS_12S

plans:
  A_STABLE_PRECISION: plan_a_stable_grasp + precision_oracle
  B_STABLE_DIRECT_HANDOFF: plan_b_stable_grasp + direct_handoff
  B_STABLE_PRECISION: plan_b_stable_grasp + precision_oracle
  C_RECATCH_DIRECT_HANDOFF: plan_c_recatch + direct_handoff
  C_RECATCH_PRECISION: plan_c_recatch + precision_oracle
  D_PRECISION: precision_oracle_only
  runtime_policy: single_transformer

training:
  status: not_started
  sft: false
  grpo: false
  notes: >
    Regenerated Precision experts require dataset_version experts_v2 and
    oracle_implementation precision_state_machine_v23. Do not mix with
    historical unified_experts Precision rows.
