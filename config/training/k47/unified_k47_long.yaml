# Longer K=47 GRPO run. Execute only after the 20-update pilot has been inspected.
# Same data and decoder as config/training/k47/unified_k47.yaml.

codebook: results/archive/demo_results/diagnostics/raw/legal_recovery_v2/codebook_selected_k47.npy
supervised_targets: results/archive/demo_results/diagnostics/raw/legal_recovery_v2/supervised_targets.jsonl
grpo_initial_conditions: results/archive/demo_results/diagnostics/raw/legal_recovery_v2/grpo_initial_conditions.jsonl
supervised_output: results/archive/demo_results/diagnostics/raw/unified_k47/supervised
eval_output: results/archive/demo_results/diagnostics/raw/unified_k47/eval_long
grpo_output: results/archive/demo_results/diagnostics/raw/unified_k47/grpo_long
seed: 1
device: cuda
epochs: 40
batch_size: 8
lr: 0.0003
grpo_updates: 120
grpo_lr: 0.00003
kl_coef: 0.05
clip: 0.2
group: 4
grpo_save_every: 12
rollout_cap_steps: 120
eval_cap_steps: 120
